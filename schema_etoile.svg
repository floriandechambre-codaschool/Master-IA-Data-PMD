<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Modèle en étoile — ventes</text>

  <!-- Relations -->
  <g stroke="#6b7280" stroke-width="2" fill="none">
    <line x1="450" y1="190" x2="450" y2="150"/>
    <line x1="340" y1="280" x2="250" y2="280"/>
    <line x1="560" y1="280" x2="650" y2="280"/>
    <line x1="450" y1="390" x2="450" y2="420"/>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="450" y="172">cle_date</text>
    <text x="295" y="270">id_client</text>
    <text x="605" y="270">id_produit</text>
    <text x="450" y="410">id_magasin</text>
  </g>
  <g font-size="12" fill="#374151">
    <text x="458" y="186">n</text><text x="458" y="156">1</text>
    <text x="326" y="296">n</text><text x="254" y="296">1</text>
    <text x="566" y="296">n</text><text x="640" y="296">1</text>
    <text x="458" y="402">n</text><text x="458" y="432">1</text>
  </g>

  <!-- Table de faits -->
  <rect x="340" y="190" width="220" height="200" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">fact_sales</text>
  <line x1="340" y1="226" x2="560" y2="226" stroke="#b45309"/>
  <g font-size="12" fill="#1f2937">
    <text x="352" y="246">cle_date (FK)</text>
    <text x="352" y="262">id_client (FK)</text>
    <text x="352" y="278">id_produit (FK)</text>
    <text x="352" y="294">id_magasin (FK)</text>
    <text x="352" y="316">quantite</text>
    <text x="352" y="332">prix_unitaire</text>
    <text x="352" y="348">remise_pct</text>
    <text x="352" y="364">montant, montant_net</text>
    <text x="352" y="380">statut</text>
  </g>

  <!-- dim_date -->
  <rect x="340" y="50" width="220" height="100" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="450" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">dim_date</text>
  <line x1="340" y1="82" x2="560" y2="82" stroke="#1d4ed8"/>
  <g font-size="12" fill="#1f2937">
    <text x="352" y="100">cle_date (PK), date</text>
    <text x="352" y="116">annee, trimestre, mois, nom_mois</text>
    <text x="352" y="132">semaine_iso, nom_jour, est_weekend</text>
  </g>

  <!-- dim_customer -->
  <rect x="30" y="220" width="220" height="120" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
  <text x="140" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">dim_customer</text>
  <line x1="30" y1="252" x2="250" y2="252" stroke="#15803d"/>
  <g font-size="12" fill="#1f2937">
    <text x="42" y="274">id_client (PK)</text>
    <text x="42" y="292">+ 4 attributs descriptifs</text>
    <text x="42" y="310">(source : clients.csv)</text>
  </g>

  <!-- dim_product -->
  <rect x="650" y="220" width="220" height="120" rx="8" fill="#fbcfe8" stroke="#be185d" stroke-width="2"/>
  <text x="760" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#831843">dim_product</text>
  <line x1="650" y1="252" x2="870" y2="252" stroke="#be185d"/>
  <g font-size="12" fill="#1f2937">
    <text x="662" y="274">id_produit (PK)</text>
    <text x="662" y="292">+ 4 attributs (libelle, ...)</text>
    <text x="662" y="310">membre « Inconnu » : P9999</text>
  </g>

  <!-- dim_store -->
  <rect x="340" y="420" width="220" height="100" rx="8" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="450" y="444" text-anchor="middle" font-size="15" font-weight="bold" fill="#4c1d95">dim_store</text>
  <line x1="340" y1="452" x2="560" y2="452" stroke="#6d28d9"/>
  <g font-size="12" fill="#1f2937">
    <text x="352" y="474">id_magasin (PK)</text>
    <text x="352" y="492">+ 4 attributs descriptifs</text>
    <text x="352" y="508">(source : magasins.csv)</text>
  </g>

  <text x="450" y="548" text-anchor="middle" font-size="11" fill="#6b7280">PK = clé primaire · FK = clé étrangère · relations 1 (dimension) à n (faits)</text>
</svg>
